# tehol-specific noctalia settings.

# Work VPN runs here, so surface its state next to the network glyph.
[widget.network]
vpn_status = "both"
show_vpn_label = true

[bar.main]
end = ["external-monitor", "battery", "brightness", "volume", "network", "latency", "tailscale", "tailnet", "taildrop", "bluetooth", "notifications"]

[widget.tailnet]
type = "custom_button"
glyph = "arrows-exchange"
tooltip = "Switch tailnet"

[widget.tailnet.actions]
left = "exec tailnet-switch"
