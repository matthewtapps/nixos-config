[bar.main]
end = ["external-monitor", "battery", "brightness", "volume", "network", "latency", "tailscale", "taildrop", "lan-mouse", "bluetooth", "notifications"]

[widget.external-monitor]
type = "custom_button"
glyph = "device-desktop"
tooltip = "Toggle external monitor"

[widget.external-monitor.actions]
left = "exec external-monitor-toggle"

[system.monitor]
gpu_poll_seconds = 0

[idle]
behavior_order = ["lock", "screen-off", "battery-suspend"]
pre_action_fade_seconds = 5.0

[idle.behavior.lock]
enabled = true
timeout = 300
action = "lock"

[idle.behavior.screen-off]
enabled = true
timeout = 330
locked_timeout = 20
action = "screen_off"

[idle.behavior.battery-suspend]
enabled = true
timeout = 1200
action = "command"
command = "grep -q Discharging /sys/class/power_supply/BAT*/status && systemctl suspend"
