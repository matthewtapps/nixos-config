# Desktop profile: a bar without the battery widgets, and lock and blank
# together after ten minutes, never suspend.

[bar.main]
end = ["volume", "network", "latency", "tailscale", "taildrop", "bluetooth", "notifications"]

[system.monitor]
gpu_poll_seconds = 5.0

[idle]
behavior_order = ["lock", "screen-off"]

[idle.behavior.lock]
enabled = true
timeout = 600
action = "lock"

[idle.behavior.screen-off]
enabled = true
timeout = 600
action = "screen_off"
