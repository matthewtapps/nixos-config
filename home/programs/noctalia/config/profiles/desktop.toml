[bar.main]
end = ["volume", "network", "latency", "tailscale", "taildrop", "bluetooth", "notifications"]

[system.monitor]
gpu_poll_seconds = 5.0

[idle]
behavior_order = ["lock", "screen-off"]

[idle.behavior.lock]
enabled = true
timeout = 600
action = "lock"

[idle.behavior.screen-off]
enabled = true
timeout = 630
locked_timeout = 20
action = "screen_off"
