id = "matt/lan-mouse"
name = "Lan Mouse"
version = "1.0.0"
plugin_api = 24
author = "matt"
license = "MIT"
icon = "mouse"
description = "Arrange Lan Mouse peers across your tailnet by drag and drop."
tags = ["network", "bar", "panel"]
dependencies = ["lan-mouse", "hyprctl"]

[[setting]]
key = "hosts"
type = "string_list"
label_key = "settings.hosts.label"
description_key = "settings.hosts.description"
default = []

[[setting]]
key = "layoutd_port"
type = "int"
label_key = "settings.layoutd_port.label"
default = 8472
min = 1
max = 65535
advanced = true

[[setting]]
key = "lan_mouse_bin"
type = "string"
label_key = "settings.lan_mouse_bin.label"
default = "lan-mouse"
advanced = true

[[service]]
id = "service"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "bar.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 560
height = 440
placement = "attached"
position = "auto"
open_near_click = true
dismiss_on_outside_click = true
